[package]
name = "alfadoc-app"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
publish = false
description = "Alfadoc desktop app: GridCraft, WordCraft and DeckCraft in one window"
default-run = "alfadoc"

[lints]
workspace = true

[[bin]]
name = "alfadoc"
path = "src/main.rs"

[dependencies]
alfadoc-model = { workspace = true }
alfadoc-bridge = { workspace = true }
alfadoc-sync = { workspace = true }
alfadoc-adapter-grid = { workspace = true }
alfadoc-adapter-deck = { workspace = true }
alfadoc-adapter-word = { workspace = true }
gridcraft-engine = { workspace = true }
gridcraft-core = { workspace = true }
gridcraft-numfmt = { workspace = true }
gridcraft-ui-egui = { workspace = true }
wordcraft-engine = { workspace = true }
wordcraft-ui-egui = { workspace = true }
deckcraft-engine = { workspace = true }
deckcraft-ui-egui = { workspace = true }
egui = { workspace = true }
rfd = { workspace = true }
serde = { workspace = true }
serde_json = { workspace = true }
log = { workspace = true }

[target.'cfg(not(target_arch = "wasm32"))'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit", "clipboard", "wayland", "x11"] }
# System clipboard (HTML too), printing and audio, as in the engines' own desktop apps.
arboard = { version = "3.6", default-features = false, features = ["wayland-data-control"] }
craft-print = { git = "https://github.com/storytold/craft-libs", rev = "92d392cff132eaf53e13afff77f38b5c11b73aa0" }
cpal = "0.16"
deckcraft-media = { workspace = true }

# The browser build (experimental): see docs/WEB.md.
[target.'cfg(target_arch = "wasm32")'.dependencies]
eframe = { workspace = true, features = ["default_fonts", "wgpu", "accesskit"] }
wasm-bindgen-futures = "0.4"
js-sys = "0.3"

[target.'cfg(windows)'.build-dependencies]
winresource = "0.1"
